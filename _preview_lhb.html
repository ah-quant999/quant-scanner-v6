window.NORTH_FUND_DATA = {};
function fmtDataTime(timeStr) {
  if (!timeStr) return '';
  var parts = timeStr.split(' ');
  var datePart = parts[0] || '';
  var timePart = (parts[1] || '').substring(0, 5);
  var dd = new Date(datePart.replace(/-/g, '/') + ' ' + (parts[1] || ''));
  var ts = dd.getTime();
  if (isToday(timeStr)) {
    // 日期是今天，但时间还没到 → 降级为"昨日"
    var now = new Date();
    if (dd > now) {
      return { text: '昨日 ' + timePart, stale: true, daysAgo: 1, mmdd: '', time: timePart, ts: ts };
    }
    return { text: '今日 ' + timePart, stale: false, ts: ts };
  }
  // 非今天：用"当前时刻"而非"今日零点"计算天数差（避免早上看昨日下午数据误判为今日）
  var dp = datePart.split('-');
  var mmdd = (dp[1] ? parseInt(dp[1]) : '') + '/' + (dp[2] ? parseInt(dp[2]) : '');
  var now2 = new Date();
  var diffDays = Math.floor((now2 - dd) / 86400000);
  if (diffDays <= 0) { return { text: '昨日 ' + timePart, stale: true, daysAgo: 1, mmdd: mmdd, time: timePart, ts: ts }; }
  if (diffDays === 1) { return { text: '昨日 ' + timePart, stale: true, daysAgo: 1, mmdd: mmdd, time: timePart, ts: ts }; }
  // ≥2天前：红色报警
  if (diffDays <= 7) { return { text: diffDays + '天前 ' + timePart, stale: true, critical: true, daysAgo: diffDays, mmdd: mmdd, time: timePart, ts: ts }; }
  return { text: mmdd + ' ' + timePart, stale: true, critical: true, daysAgo: diffDays, mmdd: mmdd, time: timePart, ts: ts };
}

function renderLhbPredict() {

  var yzStocks = stocks.filter(function(s){ return (s.yz_net_万||0) > 8000 && (s.inst_net_万||0) <= 8000; });
  var resonance = stocks.filter(function(s){ return s.category === '纯共振'; });

  function formatNet(val_wan) {
    var yi = val_wan / 10000;
    return '+' + yi.toFixed(2) + '亿';
  }

  function yzBadge(seats) {
    if (!seats) return '';
    var badges = [];
    var seen = {};

      var d = seats[t];

      aliases.forEach(function(a){
        if (!seen[a]) {
          seen[a] = true;
          badges.push('<span style="font-size:11px;background:#fce4ec;color:#c62828;padding:1px 4px;border-radius:2px;margin-left:2px;">'+a+'</span>');
        }
      });
    });
    return badges.join('');
  }

  // 北向席位净额（万）：seats.北向 buy-sell
  function bxNet(s) {
    var seat = (s.seats || {})['北向'] || {};
    return (seat.buy || 0) - (seat.sell || 0);
  }
  // 北向加持徽章：该股北向席位净买入为正时显示
  function bxBadge(s) {
    if (bxNet(s) > 0) {

    return '';

  function renderBlock(stocks, netFn, title, bg, color, emoji, showYz, showBx, footer) {

        }
        var sBadge = (showYz ? yzBadge(s.seats) : '') + (showBx ? bxBadge(s) : '');

        b += '<span>' + s.name + sBadge + dayTag + '</span>';

        b += '</div>';
      });
      b += '</div>';
    } else {
      b += '<div style="font-size:12px;color:#999;">暂无</div>';
    }
    if (footer) { b += footer; }
    b += '</div>';
    return b;
  }

  var h = '';

  // 机构净卖数据（供买入区块底部展示）
  var it = window.INST_TRADE || null;

  if (it && it.top_sell && it.top_sell.length) {
    sellFooter = '<div style="margin-top:6px;padding-top:6px;border-top:1px solid #90caf9;">' +

          '<span>' + s.name + '</span>' +
          '<b style="font-size:12px;color:#2e7d32;white-space:nowrap;">' + (s.net_amt / 100000000).toFixed(2) + '亿</b>' +

      '</div></div>';
  }

  // 四色块（加北向席位）
  var bxStocks = stocks.filter(function(s){ return bxNet(s) > 0; });
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px;">';
  // 左1：机构净买入（底部含净卖出top5，显示北向加持徽章）
  h += renderBlock(instStocks, function(s){ return s.inst_net_万; }, '机构净买入', '#e3f2fd', '#1565c0', '🏦', false, true, sellFooter);

  h += renderBlock(resonance, function(s){ return (s.inst_net_万||0) + (s.yz_net_万||0); }, '机游共振', '#fff8e1', '#f57f17', '⚡', true, true);
  // 左3：游资净买入（显示游资别名 + 北向加持徽章）

  var lhbSummary = '';

  } else if (yzStocks.length > instStocks.length && yzStocks.length >= 2) {

  }

    h += '<div style="font-size:12px;color:#999;text-align:center;">另有 ' + others.length + ' 只不达标（未达到0.8亿门槛），暂不展示</div>';
  }

  h += '<div style="font-size:10px;color:#999;margin-top:6px;line-height:1.5;">🌎 北向=龙虎榜披露席位（仅覆盖价格/换手率异动的上市个股），非港交所全市场北向资金（2024年5月起已停更）。</div>';

  con.innerHTML = h;
}


renderLhbPredict();
</script>
