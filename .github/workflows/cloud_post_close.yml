# 九宝量化 v6.0 — 收盘全景分阶段（15:30/16:15/16:30）
# 15:30 A+H全量扫描；16:15 龙虎榜后共振；16:30 全模块刷新

name: "☁️ 收盘全景分阶段"

on:
  # ✅ 2026-07-16 闭环加固：云端恢复自主定时(cron)，发令枪降级为监控+幂等补触发。
  schedule:
    - cron: '30 7 * * *'   # 15:30 CST A+H全量扫描（每日含周末；周末跳过扫描，仅刷新非行情数据）
    - cron: '15 8 * * *'   # 16:15 CST 龙虎榜后共振
    - cron: '30 8 * * *'   # 16:30 CST 全模块三卡片刷新+部署
  workflow_dispatch:
    inputs:
      slot:
        description: '档位: "30 7 * * *" / "15 8 * * *" / "30 8 * * *"'
        required: false
        default: ''
        type: string


permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cloud-post-close-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  post-close:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ─── 构建前拉取最新 main（Fix #5：含双机刚入仓的中国源数据）───
      - name: "⬇️ 拉取最新 main（含双机入仓数据）"
        run: git pull --ff-only origin main || echo "⚠️ pull 失败，使用 checkout 快照"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖
        continue-on-error: true
        run: pip install -r requirements.txt 2>/dev/null || echo "⚠️ 依赖安装失败，将用标准库构建前端"

      - name: 注入凭据
        env:
          TOKEN_JSON: ${{ secrets.ZSXQ_TOKEN }}
          NEODATA_TOKEN_JSON: ${{ secrets.NEODATA_TOKEN }}
        run: |
          mkdir -p data
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s\n' "$TOKEN_JSON" > data/zsxq_token.json
            echo "✅ zsxq_token 已注入"
          else
            echo "⚠️ 无 ZSXQ_TOKEN secret（知识星球数据跳过）"
          fi
          if [ -n "$NEODATA_TOKEN_JSON" ]; then
            # neodata 脚本统一从仓库根目录读取 .neodata_token
            printf '%s\n' "$NEODATA_TOKEN_JSON" > .neodata_token
            echo "✅ neodata_token 已注入（云端 scanner 启用）"
          else
            echo "⚠️ 无 NEODATA_TOKEN secret（neodata 跳过）"
          fi
      - name: 设置云端运行模式
        run: echo "CLOUD_RUNNER=true" >> $GITHUB_ENV

      # ─── 15:30 A+H全量扫描 → 候选池 → 金股池 ───
      - name: "📊 15:30 — A+H全量扫描+候选池+金股池"
        if: github.event.schedule == '' && github.event.inputs.slot == '' || github.event.schedule == '30 7 * * *' || github.event.inputs.slot == '30 7 * * *'
        continue-on-error: true
        run: |
          # 🛌 周末休市保护：跳过 A+H全量扫描与候选池重建，保留周五数据；推荐/Top10 仍轻量生成。
          DOW=$(TZ=Asia/Shanghai date +%u)
          if [ "$DOW" -ge 6 ]; then
            echo "🛌 周末休市（周$DOW），跳过 A+H全量扫描与候选池重建，保留周五数据"
          else
            echo ">>> scanner.py start $(date -Iseconds)"
            timeout 600 python scanner.py full 2>&1 | tail -10 || echo "[超时/失败] scanner"
            echo "<<< scanner.py end"
            echo ">>> build_candidate_pool.py start"
            timeout 120 python build_candidate_pool.py 2>&1 | tail -3 || echo "[超时/失败] build_candidate"
            echo "<<< build_candidate_pool.py end"
          fi
          timeout 60 python generate_recommend.py 2>&1 | tail -3 || echo "[超时] recommend"
          timeout 60 python generate_top10.py 2>&1 | tail -3 || echo "[超时] top10"

      # ─── 16:15 龙虎榜公布后 ───
      - name: "🐉 16:15 — 机器共振+抱团+板块轮动+五维"
        if: github.event.schedule == '' && github.event.inputs.slot == '' || github.event.schedule == '15 8 * * *' || github.event.inputs.slot == '15 8 * * *'
        continue-on-error: true
        run: |
          # 2026-07-22 修复：fetch_lhb.py（龙虎榜）由中国数据源，改由本机双机负责，云端不再重复抓取。
          for s in calc_crds.py generate_recommend.py generate_top10.py generate_one_look.py; do
            echo ">>> $s start $(date -Iseconds)"
            timeout 90 python "$s" 2>/dev/null | tail -3 || echo "[超时/失败] $s"
            echo "<<< $s end"
          done

      # ─── 16:30 全模块（三卡片刷新） ───
      - name: "🧩 16:30 — 全模块三卡片刷新+回测滚动"
        if: github.event.schedule == '' && github.event.inputs.slot == '' || github.event.schedule == '30 8 * * *' || github.event.inputs.slot == '30 8 * * *'
        continue-on-error: true
        run: |
          # 2026-07-22 修复：fetch_sector_fund_flow.py / fetch_market_alerts.py 是中国数据源，
          # 改由本机双机负责。2026-07-23 修正：fetch_nt_data(异动/ETF/日历, akshare/东方财富中国源)
          # 亦移出云端、改由双机独家供，云端只 git pull 复用 main 上双机 NT 数据。
          for s in generate_recommend.py generate_top10.py; do
            echo ">>> $s start $(date -Iseconds)"
            timeout 90 python "$s" 2>/dev/null | tail -3 || echo "[超时/失败] $s"
            echo "<<< $s end"
          done
          echo ">>> cockpit_backtest_now.py start"
          timeout 180 python cockpit_backtest_now.py 2>/dev/null | tail -8 || echo "[超时/失败] cockpit_backtest"
          echo "<<< cockpit_backtest_now.py end"
          echo ">>> report_heartbeat.py start"
          python report_heartbeat.py --role cloud --mode cloud_postclose || echo "[跳过] heartbeat"
          echo "<<< report_heartbeat.py end"
          echo ">>> update_data_v2.py start"
          timeout 120 python update_data_v2.py 2>&1 | tail -5 || echo "[超时/失败] update_data_v2"
          echo "<<< update_data_v2.py end"
          echo "✅ 16:30 三卡片刷新+回测完成"

      # ─── 生成独立页(standalone) 并校验与主站同源同戳（RISK-2 修复 + 2026-07-16 同步闸门）───
      # ⚠️ 故意【不】加 continue-on-error：抽页/同步/同源校验任一失败即令本步失败 → 阻断部署，
      #    绝不允许「主站上线、独立页缺失/陈旧」的半残状态被 keep_files:false 推上 gh-pages。
      - name: "📱 生成独立页(standalone) + 同源同戳校验"
        run: |
          python ensure_standalone_sync.py --inject-buildstamp
          echo "✅ standalone 已与主站同步校验，可安全上线"

      # ─── 部署前数据监控闸门（构建后运行：校验数据正确性+新鲜度+构建完整性；失败则阻断部署）───
      - name: "🔎 数据监控(正确性+新鲜度+构建完整性)"
        continue-on-error: true
        run: |
          python verify_data_vs_website.py --fast --gate --only-issues || echo "MONITOR_FAIL=1" >> $GITHUB_ENV

      - name: "🔄 同步最新运维状态到 dist"
        run: |
          if [ -f data/.ops_status.json ]; then
            cp -f data/.ops_status.json dist/data/.ops_status.json
            echo "✅ 已同步 data/.ops_status.json → dist/data/.ops_status.json"
          else
            echo "⚠️ data/.ops_status.json 不存在，跳过同步"
          fi

      # 2026-07-22 修复：监控只告警、不阻断部署。云端部署应以本机双机推上来的最新数据为准，
      # 若监控发现陈旧/异常，由本地 watchdog 自动重抓修复，而不是把站点冻结在旧版本。
      - name: "⚠️ 监控告警(不阻断部署·自愈由本地watchdog负责)"
        if: ${{ env.MONITOR_FAIL == '1' }}
        run: |
          echo "::warning::数据监控命中问题(数据正确性/新鲜度/构建完整性)，但【不阻断部署】——继续上线；详情见 data/verify_report.json 与运维状态卡片。陈旧数据由本地 data_freshness_watchdog 每30分钟自动重抓修复。"

      # ─── 🛡️ 新鲜度闸门（2026-07-20 统一加）：防旧数据覆盖 gh-pages ───
      # 2026-07-22 修复：闸门返回 1 时会写 SKIP_DEPLOY=true 跳过部署，但不应让 job 整体变 failure。
      - name: "🛡️ 新鲜度闸门：对比 gh-pages 当前数据"
        continue-on-error: true
        run: python check_freshness_vs_ghpages.py

      - name: "🔍 16:30 — 部署前诊断"
        if: (github.event.schedule == '' && github.event.inputs.slot == '' || github.event.schedule == '30 8 * * *' || github.event.inputs.slot == '30 8 * * *') && env.SKIP_DEPLOY != 'true'
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html 不存在，终止部署"
            exit 1
          fi
          echo "✅ dist/index.html 存在"

      - name: "🚀 16:30 — 部署三卡片版 (direct git push)"
        if: (github.event.schedule == '' && github.event.inputs.slot == '' || github.event.schedule == '30 8 * * *' || github.event.inputs.slot == '30 8 * * *') && env.SKIP_DEPLOY != 'true'
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git config user.name "cloud-bot"
          git config user.email "cloud-bot@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          git push -f "https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v6.git" HEAD:gh-pages
          echo "本地部署 HEAD: $(git rev-parse HEAD)"

      - name: "✅ 16:30 — 部署验证 (ls-remote 比对 SHA)"
        if: (github.event.schedule == '' && github.event.inputs.slot == '' || github.event.schedule == '30 8 * * *' || github.event.inputs.slot == '30 8 * * *') && env.SKIP_DEPLOY != 'true'
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 8
          REMOTE=$(git ls-remote "https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v6.git" gh-pages | cut -f1)
          LOCAL=$(cd dist && git rev-parse HEAD)
          echo "远程 gh-pages HEAD: $REMOTE"
          echo "本地 部署   HEAD: $LOCAL"
          if [ -z "$REMOTE" ] || [ "$REMOTE" != "$LOCAL" ]; then
            echo "::error::🚨 部署未生效！远程 gh-pages ($REMOTE) ≠ 本地 ($LOCAL)"
            exit 1
          fi
          echo "✅ gh-pages 已成功刷新，部署闸门通过"

      - name: "💓 写云端心跳"
        continue-on-error: true
        run: |
          echo "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') | cloud | cloud_post_close | DONE" >> data/_heartbeat.log
          git config user.name "cloud-bot"
          git config user.email "cloud-bot@users.noreply.github.com"
          git add -f data/_heartbeat.log
          git diff --cached --quiet || (git commit -m "heartbeat: cloud_post_close done" && git push origin main)

      - name: "📝 写日志"
        run: |
          if [ "${SKIP_DEPLOY:-false}" = "true" ]; then
            echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_post_close\",\"host\":\"GitHubActions\",\"success\":true,\"skipped\":\"freshness_gate\"}" >> HANDOVER_LOG.jsonl
            echo "⏭️ 新鲜度闸门阻断：本地数据旧于 gh-pages，部署跳过"
          else
            echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_post_close\",\"host\":\"GitHubActions\",\"success\":true}" >> HANDOVER_LOG.jsonl
            echo "✅ 任务完成"
          fi

      - name: "⏭️ 跳过通知"
        if: ${{ env.SKIP_DEPLOY == 'true' }}
        run: echo "::warning::⏭️ 新鲜度闸门阻断：本地数据旧于 gh-pages，未部署。双机新数据保留完好。"

      # 数据监控闸门：部署已完成，此处仅把 job 标红以触发告警(safety-net/邮件)，不影响已上线数据
      - name: "🔎 数据监控告警闸门(正确性+新鲜度)"
        if: always()
        run: |
          if [ "${MONITOR_FAIL:-0}" = "1" ]; then
            echo "::error::数据监控命中失败(数据正确性或新鲜度一致性)，详情见 data/verify_report.json 与运维状态卡片"
            exit 1
          fi
          echo "🟢 数据正确性 + 新鲜度一致性 监控通过"
