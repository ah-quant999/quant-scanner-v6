# 九宝量化 v6.0 — 收盘全景分阶段（15:30/16:15/16:30）
# 15:30 A+H全量扫描；16:15 龙虎榜后共振；16:30 全模块刷新

name: "☁️ 收盘全景分阶段"

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 15:30 CST — A+H全量扫描
    - cron: '15 8 * * 1-5'   # 16:15 CST — 龙虎榜后处理
    - cron: '30 8 * * 1-5'   # 16:30 CST — 全模块
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cloud-post-close-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  post-close:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt 2>/dev/null

      - name: 注入凭据
        env:
          TOKEN_JSON: ${{ secrets.ZSXQ_TOKEN }}
          NEODATA_TOKEN_JSON: ${{ secrets.NEODATA_TOKEN }}
        run: |
          mkdir -p data
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s\n' "$TOKEN_JSON" > data/zsxq_token.json
            echo "✅ zsxq_token 已注入"
          else
            echo "⚠️ 无 ZSXQ_TOKEN secret（知识星球数据跳过）"
          fi
          if [ -n "$NEODATA_TOKEN_JSON" ]; then
            printf '%s\n' "$NEODATA_TOKEN_JSON" > data/.neodata_token
            echo "✅ neodata_token 已注入（云端 scanner 启用）"
          else
            echo "⚠️ 无 NEODATA_TOKEN secret（neodata 跳过）"
          fi
      - name: 设置云端运行模式
        run: echo "CLOUD_RUNNER=true" >> $GITHUB_ENV

      # ─── 15:30 A+H全量扫描 → 候选池 → 金股池 ───
      - name: "📊 15:30 — A+H全量扫描+候选池+金股池"
        if: github.event.schedule == '30 7 * * 1-5'
        continue-on-error: true
        run: |
          echo ">>> scanner.py start $(date -Iseconds)"
          timeout 600 python scanner.py full 2>&1 | tail -10 || echo "[超时/失败] scanner"
          echo "<<< scanner.py end"
          echo ">>> build_candidate_pool.py start"
          timeout 120 python build_candidate_pool.py 2>&1 | tail -3 || echo "[超时/失败] build_candidate"
          echo "<<< build_candidate_pool.py end"
          timeout 60 python generate_recommend.py 2>&1 | tail -3 || echo "[超时] recommend"
          timeout 60 python generate_top10.py 2>&1 | tail -3 || echo "[超时] top10"

      # ─── 16:15 龙虎榜公布后 ───
      - name: "🐉 16:15 — 龙虎榜+机器共振+抱团+板块轮动+五维"
        if: github.event.schedule == '15 8 * * 1-5'
        continue-on-error: true
        run: |
          for s in fetch_lhb.py update_triple_resonance_daily.py update_multi_resonance_daily.py calc_crds.py generate_recommend.py generate_top10.py generate_one_look.py; do
            echo ">>> $s start $(date -Iseconds)"
            timeout 90 python "$s" 2>/dev/null | tail -3 || echo "[超时/失败] $s"
            echo "<<< $s end"
          done

      # ─── 16:30 全模块（三卡片刷新） ───
      - name: "🧩 16:30 — 全模块三卡片刷新"
        if: github.event.schedule == '30 8 * * 1-5'
        continue-on-error: true
        run: |
          for s in fetch_sector_fund_flow.py fetch_nt_data.py fetch_market_alerts.py generate_recommend.py generate_top10.py; do
            echo ">>> $s start $(date -Iseconds)"
            timeout 90 python "$s" 2>/dev/null | tail -3 || echo "[超时/失败] $s"
            echo "<<< $s end"
          done
          echo ">>> update_data_v2.py start"
          timeout 120 python update_data_v2.py 2>&1 | tail -5 || echo "[超时/失败] update_data_v2"
          echo "<<< update_data_v2.py end"
          echo "✅ 16:30 三卡片刷新完成"

      - name: "🔍 16:30 — 部署前诊断"
        if: github.event.schedule == '30 8 * * 1-5'
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html 不存在，终止部署"
            exit 1
          fi
          echo "✅ dist/index.html 存在"

      - name: "🚀 16:30 — 部署三卡片版"
        if: github.event.schedule == '30 8 * * 1-5'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          user_name: cloud-bot
          user_email: cloud-bot@users.noreply.github.com

      - name: "✅ 16:30 — 部署验证"
        if: github.event.schedule == '30 8 * * 1-5'
        run: |
          sleep 5
          git ls-remote origin gh-pages

      - name: "📝 写日志"
        run: |
          echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_post_close\",\"host\":\"GitHubActions\",\"success\":true}" >> HANDOVER_LOG.jsonl
          echo "✅ 任务完成"
