# 九宝量化 v6.0 — 盘中云端任务
# 覆盖 09:30/10:31/11:46/13:31/14:31 五个盘中时间点
# 2026-07-20 09:30 新增：开盘即跑盘中扫描，解决 09:20 pre_market 后到 10:31 之间
#   整整一小时没有盘中数据刷新的问题（本机 pre_market 不含 run_intraday_scan.py）
# 2026-07-20 移除 09:00 cron：本机小九 09:20 pre_market 已覆盖全部数据源，
#   云端 09:00 与中国源脚本重叠且美区 runner 抓中国源必然超时，改为纯本机负责。
# 执行「全量抓取 → 扫描 → 构建 → 部署」，
# 确保交易时段站点始终新鲜。

name: "☁️ 盘前+盘中任务"

on:
  # ✅ 2026-07-16 闭环加固：云端恢复自主定时(cron)，不再 solely 依赖小九发令枪。
  #   GitHub cron 作「主力执行」；小九发令枪(trigger_cloud_dispatch.py)降级为「监控+幂等补触发」；
  #   safety-net 为最后兜底。各 cron 串与下方 slot 串一致，由 step 的 if 自动选档。
  # 2026-07-20 移除 09:00 cron：本机小九 09:20 独家部署，云端 09:00 与中国源重叠。
  schedule:
    - cron: '30 1 * * *'   # 09:30 CST（开盘即跑）
    - cron: '31 2 * * *'   # 10:31 CST
    - cron: '46 3 * * *'   # 11:46 CST
    - cron: '31 5 * * *'   # 13:31 CST
    - cron: '31 6 * * *'   # 14:31 CST
  workflow_dispatch:
    inputs:
      slot:
        description: '模拟的 cron 档位，如 "31 2 * * *"；留空=默认全量刷新'
        required: false
        default: ''
        type: string


permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  # 2026-07-22 修复：原来所有 slot 共享一个 group，09:30/10:31/11:46/13:31/14:31
  # 多个 run 会在同一 group 排队/冲突，导致部分 slot 被积压或取消。
  # 现在按 schedule 时间分 group，不同 slot 互不阻塞。
  group: cloud-intraday-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ─── 构建前拉取最新 main（Fix #5：含双机刚入仓的中国源数据）───
      - name: "⬇️ 拉取最新 main（含双机入仓数据）"
        run: git pull --ff-only origin main || echo "⚠️ pull 失败，使用 checkout 快照"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖
        continue-on-error: true
        run: pip install -r requirements.txt 2>/dev/null || echo "⚠️ 依赖安装失败，将用标准库构建前端"

      - name: 注入凭据
        env:
          TOKEN_JSON: ${{ secrets.ZSXQ_TOKEN }}
          NEODATA_TOKEN_JSON: ${{ secrets.NEODATA_TOKEN }}
        continue-on-error: true
        run: |
          mkdir -p data
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s\n' "$TOKEN_JSON" > data/zsxq_token.json
            echo "✅ zsxq_token 已注入"
          else
            echo "⚠️ 无 ZSXQ_TOKEN secret（知识星球数据跳过）"
          fi
          if [ -n "$NEODATA_TOKEN_JSON" ]; then
            # neodata 脚本统一从仓库根目录读取 .neodata_token
            printf '%s\n' "$NEODATA_TOKEN_JSON" > .neodata_token
            echo "✅ neodata_token 已注入（云端 scanner 启用）"
          else
            echo "⚠️ 无 NEODATA_TOKEN secret（neodata 跳过）"
          fi
      - name: 设置云端运行模式
        run: echo "CLOUD_RUNNER=true" >> $GITHUB_ENV

      # ─── 全量数据抓取（每个时间点都跑，保证各数据块完整） ───
      - name: "📡 全量数据抓取"
        continue-on-error: true
        run: |
          # 注：以下中国数据源在美区 runner 必 60s 超时(exit 124) 不重写文件→数据冻结，
          # 已全部移出云端，改由本机双机(小九/阿狸咪 :40 自动化)在中国网络抓取并 push main，
          # 云端直接复用 main 上的新鲜数据。仅保留美区可达的 US/国际源脚本：
          #   fetch_suspension_alert / fetch_main_week / fetch_main_stock /
          #   fetch_south_individual / fetch_herding_data / fetch_ipo_data / fetch_macro_data /
          #   fetch_sh_index_fib / fetch_crisis_data
          # ⚠️ 2026-07-23 修正：fetch_nt_data(异动/ETF/日历, akshare/东方财富中国源) 原被误列为
          #   国际源而留在云端抓取，实则美区 runner 抓不稳→部署陈旧 NT(14:47 档即此 bug)。
          #   现改由双机独家供，云端跳过(见 run_intraday_scan.py 的 CLOUD_RUNNER 跳过逻辑)，
          #   只 git pull 复用 main 上的双机 NT 数据。
          for script in \
            fetch_suspension_alert.py \
            fetch_main_week.py fetch_main_stock.py \
            fetch_south_individual.py fetch_herding_data.py \
            fetch_ipo_data.py \
            fetch_macro_data.py \
            fetch_crisis_data.py; do
            echo ">>> $script start $(date -Iseconds)"
            timeout --kill-after=10 60 python "$script" > /tmp/last_fetch.log 2>&1 || echo "[超时/失败] $script (exit $?)"
            echo "<<< $script end $(date -Iseconds)"
          done

      # ─── 盘中扫描（每时间点：scanner watch + 盘中切片） ───
      - name: "🔬 盘中扫描 (总览+预判)"
        continue-on-error: true
        run: |
          # 🛌 周末休市保护：跳过盘中扫描，避免空扫覆盖周五数据。
          DOW=$(TZ=Asia/Shanghai date +%u)
          if [ "$DOW" -ge 6 ]; then
            echo "🛌 周末休市（周$DOW），跳过盘中扫描"
            exit 0
          fi
          python run_intraday_scan.py --skip-standalone

      # ─── 云端心跳上报（先于构建，使本次部署即含云端状态）───
      - name: "💓 上报云端心跳"
        continue-on-error: true
        run: python report_heartbeat.py --role cloud --mode cloud_intraday

      # ─── 构建前再同步一次 main（RISK-覆盖：拿小九 09:38 入仓的新鲜中国源数据）───
      # ⚠️ 关键：本机 09:20 pre_market 的 sync_check 在 ~09:38 才把今日中国源推上 main，
      #   而云端 09:30 启动时的首次 git pull 只拿到 09:38 之前(=昨日)的中国源。
      #   若直接构建部署，会用旧中国源覆盖小九刚部署的今日数据 → "旧数据"复现。
      #   此处再 pull 一次，确保云端部署 = 小九新鲜中国源 + 云端盘中实时，永不回退。
      - name: "⬇️ 构建前再同步 main（拿小九 09:38 入仓新鲜中国源，防覆盖）"
        continue-on-error: true
        run: git pull --rebase origin main || git pull --ff-only origin main || echo "⚠️ 同步失败，用当前快照构建"

      # ─── 构建前端 ───
      - name: "🏗️ 构建前端"
        run: python update_data_v2.py

      # ─── 写云端心跳（供全任务探测 cross-check）───
      - name: "💓 写云端心跳"
        continue-on-error: true
        run: |
          echo "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') | cloud | cloud_intraday | DONE" >> data/_heartbeat.log

      # ─── 提交 data 回 main（让后续 workflow 也能用到） ───
      # 🛌 周末只读保护：双机(小九/阿狸咪)周末不跑，main 上的中国源/盘中数据是周五冻结版；
      #   云端周末绝不 git add -A data/ && push，避免覆盖双机盘中源数据或把空扫/陈旧数据推上去。
      - name: "📤 提交 data 回 main（周末跳过：不覆盖双机盘中源数据）"
        continue-on-error: true
        run: |
          DOW=$(TZ=Asia/Shanghai date +%u)   # 1=周一 … 7=周日
          if [ "$DOW" -ge 6 ]; then
            echo "🛌 周末休市，跳过 data 回写 main（保持只读，不覆盖双机盘中源数据）"
            exit 0
          fi
          git config user.name "cloud-bot"
          git config user.email "cloud-bot@users.noreply.github.com"
          git add -A data/ || true
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "auto: cloud intraday data $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ data 已推 main"
          fi

      # ─── 部署前诊断（确认前端构建产物存在）───
      - name: "🔍 部署前诊断 (确认 dist/index.html)"
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html 不存在，前端构建可能失败，终止部署"
            ls -la dist 2>/dev/null || echo "dist 目录不存在"
            exit 1
          fi
          echo "✅ dist/index.html 存在 ($(wc -c < dist/index.html) bytes)"

      # ─── 生成独立页(standalone) + 注入 build-stamp + 同源同戳校验（RISK-2 + 2026-07-16 同步闸门）───
      # ensure_standalone_sync.py 会：① 从 dist/index.html 重建 standalone/ ② 同步到 dist/standalone/
      # ③ 给 dist/ 全部 html 注入 build-stamp（替代原先只给主站注入、漏掉独立页的脚本）④ 同源同戳校验
      # ⚠️ 故意【不】加 continue-on-error：抽页/同步/校验任一失败即阻断部署，绝不允许半残上线。
      - name: "📱 生成独立页 + 同源同戳校验 + build-stamp"
        run: |
          python ensure_standalone_sync.py --inject-buildstamp
          echo "✅ standalone 已与主站同步校验，可安全上线"

      # ─── 🛡️ 新鲜度闸门（2026-07-20 统一加）：防旧数据覆盖 gh-pages ───
      - name: "🛡️ 新鲜度闸门：对比 gh-pages 当前数据"
        continue-on-error: false
        run: python check_freshness_vs_ghpages.py

      # ─── 部署到 GitHub Pages（原生 git push，零外部 action 依赖）───
      - name: "🚀 部署到 GitHub Pages (direct git push)"
        if: ${{ env.SKIP_DEPLOY != 'true' }}
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git config user.name "cloud-bot"
          git config user.email "cloud-bot@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          git push -f "https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v6.git" HEAD:gh-pages
          echo "本地部署 HEAD: $(git rev-parse HEAD)"

      # ─── 部署后验证：真实比对 SHA，不一致即 fail（防静默黑 20 天）───
      - name: "✅ 部署验证 (ls-remote 比对 SHA)"
        if: ${{ env.SKIP_DEPLOY != 'true' }}
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 8
          REMOTE=$(git ls-remote "https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v6.git" gh-pages | cut -f1)
          LOCAL=$(cd dist && git rev-parse HEAD)
          echo "远程 gh-pages HEAD: $REMOTE"
          echo "本地 部署   HEAD: $LOCAL"
          if [ -z "$REMOTE" ] || [ "$REMOTE" != "$LOCAL" ]; then
            echo "::error::🚨 部署未生效！远程 gh-pages ($REMOTE) ≠ 本地 ($LOCAL)"
            exit 1
          fi
          echo "✅ gh-pages 已成功刷新，部署闸门通过"

      - name: "📝 写日志"
        run: |
          if [ "${SKIP_DEPLOY:-false}" = "true" ]; then
            echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_intraday\",\"host\":\"GitHubActions\",\"success\":true,\"skipped\":\"freshness_gate\"}" >> HANDOVER_LOG.jsonl
            echo "⏭️ 新鲜度闸门阻断：本地数据旧于 gh-pages，部署跳过"
          else
            echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_intraday\",\"host\":\"GitHubActions\",\"success\":true}" >> HANDOVER_LOG.jsonl
            echo "✅ 任务完成"
          fi

      - name: "⏭️ 跳过通知"
        if: ${{ env.SKIP_DEPLOY == 'true' }}
        run: echo "::warning::⏭️ 新鲜度闸门阻断：本地数据旧于 gh-pages，未部署。双机新数据保留完好。"
