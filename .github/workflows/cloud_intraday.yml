# 九宝量化 v6.0 — 盘前+盘中云端任务（含部署）
# 覆盖 09:20/10:31/11:46/13:31/14:31 五个时间点
# 每个时间点都执行「全量抓取 → 扫描 → 构建 → 部署」，
# 确保交易时段站点始终新鲜（云端长期自洽，双机仅监控）。

name: "☁️ 盘前+盘中任务"

on:
  schedule:
    - cron: '20 1 * * 1-5'   # 09:20 CST — 盘前全景
    - cron: '31 2 * * 1-5'   # 10:31 CST — 盘中扫描
    - cron: '46 3 * * 1-5'   # 11:46 CST — 盘中扫描
    - cron: '31 5 * * 1-5'   # 13:31 CST — 盘中扫描
    - cron: '31 6 * * 1-5'   # 14:31 CST — 盘中扫描
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: cloud-intraday
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖
        continue-on-error: true
        run: pip install -r requirements.txt 2>/dev/null || echo "⚠️ 依赖安装失败，将用标准库构建前端"

      - name: 注入凭据
        env:
          TOKEN_JSON: ${{ secrets.ZSXQ_TOKEN }}
          NEODATA_TOKEN_JSON: ${{ secrets.NEODATA_TOKEN }}
        continue-on-error: true
        run: |
          mkdir -p data
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s\n' "$TOKEN_JSON" > data/zsxq_token.json
            echo "✅ zsxq_token 已注入"
          else
            echo "⚠️ 无 ZSXQ_TOKEN secret（知识星球数据跳过）"
          fi
          if [ -n "$NEODATA_TOKEN_JSON" ]; then
            printf '%s\n' "$NEODATA_TOKEN_JSON" > data/.neodata_token
            echo "✅ neodata_token 已注入（云端 scanner 启用）"
          else
            echo "⚠️ 无 NEODATA_TOKEN secret（neodata 跳过）"
          fi
      - name: 设置云端运行模式
        run: echo "CLOUD_RUNNER=true" >> $GITHUB_ENV

      # ─── 09:20 盘前全景（金股+投行，仅盘前） ───
      - name: "🌅 09:20 — 金股观测 (机构研报+投行+候选池)"
        if: github.event.schedule == '20 1 * * 1-5'
        continue-on-error: true
        run: |
          python fetch_mahoro_signals.py --non-interactive 2>/dev/null || echo "[跳过] mahoro"
          python guanlan_extractor.py || echo "[跳过] guanlan"
          python build_candidate_pool.py || echo "[跳过] build_candidate_pool"

      - name: "🌅 09:20 — 总览页 (大盘指数+宏观+隔夜)"
        if: github.event.schedule == '20 1 * * 1-5'
        continue-on-error: true
        run: |
          python fetch_macro_data.py || echo "[跳过] macro"
          python fetch_fomc.py || echo "[跳过] fomc"
          python fetch_overnight_timeline.py 2>/dev/null || echo "[跳过] overnight"

      # ─── 全量数据抓取（每个时间点都跑，保证各数据块完整） ───
      - name: "📡 全量数据抓取"
        continue-on-error: true
        run: |
          # 注：以下中国数据源在美区 runner 必 60s 超时(exit 124) 不重写文件→数据冻结，
          # 已全部移出云端，改由本机双机(小九/阿狸咪 :40 自动化)在中国网络抓取并 push main，
          # 云端直接复用 main 上的新鲜数据。仅保留美区可达的 US/国际源脚本：
          #   fetch_nt_data / fetch_suspension_alert / fetch_main_week / fetch_main_stock /
          #   fetch_south_individual / fetch_herding_data / fetch_ipo_data / fetch_macro_data /
          #   fetch_sh_index_fib / fetch_crisis_data
          for script in \
            fetch_nt_data.py \
            fetch_suspension_alert.py \
            fetch_main_week.py fetch_main_stock.py \
            fetch_south_individual.py fetch_herding_data.py \
            fetch_ipo_data.py \
            fetch_macro_data.py \
            fetch_crisis_data.py; do
            echo ">>> $script start $(date -Iseconds)"
            timeout --kill-after=10 60 python "$script" > /tmp/last_fetch.log 2>&1 || echo "[超时/失败] $script (exit $?)"
            echo "<<< $script end $(date -Iseconds)"
          done

      # ─── 盘中扫描（每时间点：scanner watch + 盘中切片） ───
      - name: "🔬 盘中扫描 (总览+预判)"
        continue-on-error: true
        run: python run_intraday_scan.py --skip-standalone

      # ─── 云端心跳上报（先于构建，使本次部署即含云端状态）───
      - name: "💓 上报云端心跳"
        continue-on-error: true
        run: python report_heartbeat.py --role cloud --mode cloud_intraday

      # ─── 构建前端 ───
      - name: "🏗️ 构建前端"
        run: python update_data_v2.py

      # ─── 提交 data 回 main（让后续 workflow 也能用到） ───
      - name: "📤 提交 data 回 main"
        continue-on-error: true
        run: |
          git config user.name "cloud-bot"
          git config user.email "cloud-bot@users.noreply.github.com"
          git add -A data/ || true
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "auto: cloud intraday data $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ data 已推 main"
          fi

      # ─── 部署前诊断（确认前端构建产物存在）───
      - name: "🔍 部署前诊断 (确认 dist/index.html)"
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html 不存在，前端构建可能失败，终止部署"
            ls -la dist 2>/dev/null || echo "dist 目录不存在"
            exit 1
          fi
          echo "✅ dist/index.html 存在 ($(wc -c < dist/index.html) bytes)"

      # ─── 注入 build-stamp（北京时间，每次部署刷新）───
      # 注：云端用 peaceiris/actions-gh-pages 直接发布 ./dist，update_data_v2.py 不写 build-stamp，
      # 必须在此显式注入，否则运维卡/前端一直显示最后一次「本地 deploy_now.py」的时间。
      - name: "🏷️ 注入 build-stamp (北京时间)"
        run: |
          STAMP=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          python - "$STAMP" <<'PY'
          import re, sys
          stamp = sys.argv[1]
          p = "dist/index.html"
          s = open(p, encoding="utf-8").read()
          if 'name="build-stamp"' in s:
              s = re.sub(r'name="build-stamp" content="[^"]*"', f'name="build-stamp" content="{stamp}"', s)
          else:
              s = s.replace("<head>", f'<head>\n<meta name="build-stamp" content="{stamp}">', 1)
          open(p, "w", encoding="utf-8").write(s)
          print("build-stamp =", stamp)
          PY

      # ─── 生成独立页(standalone) 随主站一起部署（修复 RISK-2：云端不再清空独立页）───
      - name: "📱 生成独立页(standalone)"
        continue-on-error: true
        run: |
          python extract_panels_v6.py
          mkdir -p dist/standalone
          cp -r standalone/*.html dist/standalone/ 2>/dev/null || true
          echo "✅ standalone 已并入 dist/standalone/（与本地 deploy_now.py 产物一致）"

      # ─── 部署到 GitHub Pages ───
      - name: "🚀 部署到 GitHub Pages"
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          user_name: cloud-bot
          user_email: cloud-bot@users.noreply.github.com

      # ─── 部署后验证（确认 gh-pages 已刷新）───
      - name: "✅ 部署验证 (ls-remote 确认 gh-pages)"
        run: |
          sleep 5
          echo "当前 gh-pages HEAD:"
          git ls-remote origin gh-pages

      - name: "📝 写日志"
        run: |
          echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_intraday\",\"host\":\"GitHubActions\",\"success\":true}" >> HANDOVER_LOG.jsonl
          echo "✅ 任务完成"
