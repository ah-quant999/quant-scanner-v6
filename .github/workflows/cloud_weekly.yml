# 九宝量化 v6.0 — 周期任务
# 周一 06:30 — industry_map.json 重建（云端跑，绕过家用机限流）
# 周五 19:30 — 股票名称映射更新
# 周六 07:30 — T+1 数据补全

name: "☁️ 周期任务"

on:
  schedule:
    - cron: '30 22 * * 0'   # 周日 06:30 CST — 周一industry_map（提前准备）
    - cron: '30 11 * * 5'   # 周五 19:30 CST — 股票名称
    - cron: '30 23 * * 5'   # 周六 07:30 CST — T+1
  workflow_dispatch:
    inputs:
      task:
        description: '指定任务: t1=周六T+1补全, industry_map=行业地图重建, full_industry_map=全量行业覆盖(5199只,约30min)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: cloud-weekly-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 130

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt 2>/dev/null

      - name: 注入凭据
        env:
          TOKEN_JSON: ${{ secrets.ZSXQ_TOKEN }}
        run: |
          mkdir -p data
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s\n' "$TOKEN_JSON" > data/zsxq_token.json
            echo "✅ zsxq_token 已注入"
          else
            echo "⚠️ 无 ZSXQ_TOKEN secret（知识星球数据跳过）"
          fi

      # ─── 周一 industry_map.json 重建（云端网络好，约1h） ───
      - name: "🏭 周一 — industry_map.json 重建（云端，绕开限流）"
        if: github.event.schedule == '30 22 * * 0' || github.event.inputs.task == 'industry_map'
        continue-on-error: true
        run: |
          python fetch_industry_map.py || echo "[跳过] industry_map"
          if [ -f data/industry_map.json ]; then
            git add -f data/industry_map.json
            git commit -m "data: industry_map 周重建 $(TZ=Asia/Shanghai date '+%Y-%m-%d')" || echo "无变更"
            git push origin main || echo "推送跳过"
          fi

      # ─── 全量 industry_map (手动触发，6 并行进程，~30min) ───
      - name: "🌐 全量 — industry_map.json 全量覆盖 A 股（5199 只，6 并行进程 ~30min）"
        if: github.event.inputs.task == 'full_industry_map'
        continue-on-error: true
        run: |
          python fetch_industry_map.py --full-universe --shards 6 || echo "[跳过] full_industry_map"
          if [ -f data/industry_map.json ]; then
            git add -f data/industry_map.json
            git commit -m "data: industry_map 全量 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" || echo "无变更"
            git push origin main || echo "推送跳过"
          fi

      # ─── 周五 19:30 股票名称映射更新 ───
      - name: "📝 周五 — 股票名称映射更新（收盘部署附带）"
        if: github.event.schedule == '30 11 * * 5'
        continue-on-error: true
        run: |
          python fetch_stock_names.py || echo "[跳过] stock_names"
          python batch_update.py close_deploy || echo "[跳过] close_deploy"
          python update_data_v2.py || echo "[跳过] update_data_v2"
          python build_market_signal.py 2>/dev/null || echo "[跳过] market_signal"
          python refresh_standalone_and_deploy.py 2>/dev/null || echo "[跳过] refresh_standalone"

      # ─── 周六 07:30 T+1 数据补全（使用 close 全量模式抓取 7×24 后发布的 T+1 数据） ───
      - name: "💰 周六 — T+1 数据补全（定时或手动 task=t1）"
        if: github.event.schedule == '30 23 * * 5' || github.event.inputs.task == 't1'
        continue-on-error: false
        run: |
          python batch_update.py close || echo "[重试] close 失败，仍尝试轻量部署"
          python batch_update.py weekend_light || echo "[跳过] weekend_light"

      # ─── 生成独立页(standalone) 并校验与主站同源同戳（RISK-2 修复 + 2026-07-16 同步闸门）───
      # ⚠️ 故意【不】加 continue-on-error：抽页/同步/同源校验任一失败即令本步失败 → 阻断部署。
      - name: "📱 生成独立页(standalone) + 同源同戳校验"
        run: |
          python ensure_standalone_sync.py --inject-buildstamp
          echo "✅ standalone 已与主站同步校验，可安全上线"

      # ─── 云端心跳上报（证明云端周期任务活跃）───
      - name: "💓 上报云端心跳"
        continue-on-error: true
        run: python report_heartbeat.py --role cloud --mode cloud_weekly

      # ─── 🛡️ 新鲜度闸门（2026-07-20 统一加）：防旧数据覆盖 gh-pages ───
      - name: "🛡️ 新鲜度闸门：对比 gh-pages 当前数据"
        run: python check_freshness_vs_ghpages.py

      - name: "🚀 部署 (direct git push)"
        if: always() && env.SKIP_DEPLOY != 'true'
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git config user.name "cloud-bot"
          git config user.email "cloud-bot@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          git push -f "https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v6.git" HEAD:gh-pages
          echo "本地部署 HEAD: $(git rev-parse HEAD)"

      - name: "✅ 部署验证 (ls-remote 比对 SHA)"
        if: always() && env.SKIP_DEPLOY != 'true'
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 8
          REMOTE=$(git ls-remote "https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v6.git" gh-pages | cut -f1)
          LOCAL=$(cd dist && git rev-parse HEAD)
          echo "远程 gh-pages HEAD: $REMOTE"
          echo "本地 部署   HEAD: $LOCAL"
          if [ -z "$REMOTE" ] || [ "$REMOTE" != "$LOCAL" ]; then
            echo "::error::🚨 部署未生效！远程 gh-pages ($REMOTE) ≠ 本地 ($LOCAL)"
            exit 1
          fi
          echo "✅ gh-pages 已成功刷新，部署闸门通过"

      - name: "💓 写云端心跳"
        continue-on-error: true
        run: |
          echo "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') | cloud | cloud_weekly | DONE" >> data/_heartbeat.log
          git config user.name "cloud-bot"
          git config user.email "cloud-bot@users.noreply.github.com"
          git add -f data/_heartbeat.log
          git diff --cached --quiet || (git commit -m "heartbeat: cloud_weekly done" && git push origin main)

      - name: "📝 写日志"
        run: |
          if [ "${SKIP_DEPLOY:-false}" = "true" ]; then
            echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_weekly\",\"host\":\"GitHubActions\",\"success\":true,\"skipped\":\"freshness_gate\"}" >> HANDOVER_LOG.jsonl
            echo "⏭️ 新鲜度闸门阻断：本地数据旧于 gh-pages，部署跳过"
          else
            echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_weekly\",\"host\":\"GitHubActions\",\"success\":true}" >> HANDOVER_LOG.jsonl
            echo "✅ 周期任务完成"
          fi

      - name: "⏭️ 跳过通知"
        if: ${{ env.SKIP_DEPLOY == 'true' }}
        run: echo "::warning::⏭️ 新鲜度闸门阻断：本地数据旧于 gh-pages，未部署。双机新数据保留完好。"
