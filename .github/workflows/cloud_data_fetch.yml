# 九宝量化 v6.0 — 云端收盘数据抓取 (17:31)
# 替换本地 close_p1，在 18:31 全量扫描前把数据准备好。

name: "☁️ 收盘数据抓取 (17:31)"

on:
  # ✅ 2026-07-16 闭环加固：云端恢复自主定时(cron)，发令枪降级为监控+幂等补触发。
  schedule:
    - cron: '31 9 * * *'   # 17:31 CST 收盘数据抓取（每日含周末；中国源静默超时，仅刷新 US/国际源）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cloud-data-fetch
  cancel-in-progress: true

jobs:
  data-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt 2>/dev/null

      - name: 注入凭据
        env:
          TOKEN_JSON: ${{ secrets.ZSXQ_TOKEN }}
          NEODATA_TOKEN_JSON: ${{ secrets.NEODATA_TOKEN }}
        run: |
          mkdir -p data
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s\n' "$TOKEN_JSON" > data/zsxq_token.json
            echo "✅ zsxq_token 已注入"
          else
            echo "⚠️ 无 ZSXQ_TOKEN secret（知识星球数据跳过）"
          fi
          if [ -n "$NEODATA_TOKEN_JSON" ]; then
            # neodata 脚本统一从仓库根目录读取 .neodata_token
            printf '%s\n' "$NEODATA_TOKEN_JSON" > .neodata_token
            echo "✅ neodata_token 已注入"
          else
            echo "⚠️ 无 NEODATA_TOKEN secret（neodata 跳过）"
          fi

      - name: "📡 研报+投行信号"
        continue-on-error: true
        run: |
          python fetch_maharo_signals.py --non-interactive 2>/dev/null || echo "[跳过] maharo"
          python guanlan_extractor.py || echo "[跳过] guanlan"

      - name: "📡 全量数据抓取（仅美区/国际可达源）"
        continue-on-error: true
        run: |
          # 2026-07-22 修复：中国数据源彻底移出本 workflow，改由本机双机负责。
          # 云端只跑美区 runner 稳定可达的脚本，避免 60s 超时导致 job failure。
          # 已移除：fetch_margin_etf / fetch_stock_deviation / fetch_sector_fund_flow /
          #         fetch_sector_rs / fetch_market_alerts / fetch_concept_ranking /
          #         fetch_cffex_holdings / fetch_inst_trade / fetch_sz_index_fib
          #   （其中 fetch_sz_index_fib.py 本就不存在；fetch_sh_index_fib.py 会同时写 sz 文件）
          # 2026-07-23 修正：fetch_nt_data(异动/ETF/日历, akshare/东方财富中国源) 已移出云端，
          # 改由双机独家供；云端只 git pull 复用 main 上双机推送的 NT 数据。
          SCRIPTS="fetch_suspension_alert.py fetch_main_week.py fetch_main_stock.py fetch_south_individual.py fetch_herding_data.py fetch_ipo_data.py fetch_macro_data.py fetch_fomc.py fetch_sh_index_fib.py"
          for script in $SCRIPTS; do
            echo ">>> $script start $(date -Iseconds)"
            timeout --kill-after=10 90 python "$script" > /tmp/log_$script.log 2>&1 || echo "[超时/失败] $script (exit $?)"
            tail -1 /tmp/log_$script.log 2>/dev/null | head -c 200 | sed "s/^/  $script: /"
            echo "<<< $script end $(date -Iseconds)"
          done
          echo "=== 全量抓取完成 $(date -Iseconds) ==="

      - name: "📡 危机雷达"
        continue-on-error: true
        run: python fetch_crisis_data.py || echo "[跳过] crisis"

      # ─── 把 data/*.json 提交回 main（让 18:30 / 19:30 / 隔日 09:20 都能用到新鲜数据）───
      # ─── ⛔ 不再把 data 回写 main（根因修复 #2：防止反向污染）───
      # 中国数据源由双机（小九/阿狸咪）作为上游推到 main；美区 runner 抓中国源必 60s 超时，
      # 若把空/半截 JSON 写回 main 会覆盖双机新鲜数据，导致云端次日构建陈旧。
      # 因此云端 data fetch 只做 best-effort 本地计算，绝不 git add -A data/ && push。
      - name: "📤 提交 data 回 main（已禁用：双机为上游，云端不回写）"
        continue-on-error: true
        run: |
          echo "⛔ 云端不回写 data 到 main：中国源数据由双机作为上游推送，避免覆盖新鲜数据"
          echo "   若需云端补充某文件，应在脚本内仅 add 该特定文件并经人工确认，而非 git add -A data/"

      - name: "📝 写日志"
        run: |
          echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_data_fetch\",\"host\":\"GitHubActions\",\"success\":true}" >> HANDOVER_LOG.jsonl
          echo "✅ 17:31 数据抓取完成"

      # ─── 云端心跳上报（证明云端数据抓取活跃，即使不部署前端）───
      - name: "💓 上报云端心跳"
        continue-on-error: true
        run: python report_heartbeat.py --role cloud --mode cloud_data_fetch

      # ═══════════════════════════════════════════════
      # 🏗️ 构建+部署（将最新数据部署到 gh-pages，18:31 cloud_scanner 的最终版会覆盖本次）
      # ═══════════════════════════════════════════════

      # ─── 构建前端（数据监控已移至构建后，见部署前监控闸门）───
      - name: "🏗️ 构建前端"
        run: |
          python update_data_v2.py
          echo "✅ 构建完成"

      # ─── 生成独立页(standalone) 并校验与主站同源同戳 ───
      - name: "📱 生成独立页(standalone) + 同源同戳校验"
        run: |
          python ensure_standalone_sync.py --inject-buildstamp
          echo "✅ standalone 已与主站同步校验，可安全上线"

      # ─── 部署前诊断 ───
      - name: "🔍 部署前诊断 (确认 dist/index.html)"
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html 不存在，前端构建可能失败，终止部署"
            ls -la dist 2>/dev/null || echo "dist 目录不存在"
            exit 1
          fi
          echo "✅ dist/index.html 存在 ($(wc -c < dist/index.html) bytes)"

      # ─── 部署前数据监控闸门（构建后运行：校验数据正确性+新鲜度+构建完整性；失败则阻断部署）───
      - name: "🔎 数据监控(正确性+新鲜度+构建完整性)"
        continue-on-error: true
        run: |
          python verify_data_vs_website.py --fast --gate --only-issues || echo "MONITOR_FAIL=1" >> $GITHUB_ENV

      # ─── 自愈原则（2026-07-19 根因修复）：监控只“告警”绝不“阻断” ───
      # 旧逻辑：监控命中即 exit 1 取消部署 → 站点冻结在旧数据，且无自愈（一周“旧数据”根源）。
      # 新逻辑：监控命中只标红告警；部署照常进行。陈旧数据由本地 data_freshness_watchdog 自动重抓修复。
      - name: "⚠️ 监控告警(不阻断部署·自愈由本地watchdog负责)"
        if: ${{ env.MONITOR_FAIL == '1' }}
        run: |
          echo "::warning::数据监控命中问题(数据正确性/新鲜度/构建完整性)，但【不阻断部署】——继续上线；详情见 data/verify_report.json。陈旧数据由本地 data_freshness_watchdog 每30分钟自动重抓修复。"

      # ─── 🛡️ 新鲜度闸门（2026-07-20 统一加）：防旧数据覆盖 gh-pages ───
      # 2026-07-22 修复：闸门返回 1 时会写 SKIP_DEPLOY=true 跳过部署，但不应让 job 整体变 failure。
      - name: "🛡️ 新鲜度闸门：对比 gh-pages 当前数据"
        continue-on-error: true
        run: python check_freshness_vs_ghpages.py

      # ─── 部署（原生 git push，零外部 action 依赖）───
      - name: "🚀 部署到 GitHub Pages (direct git push)"
        if: ${{ env.SKIP_DEPLOY != 'true' }}
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git config user.name "cloud-bot"
          git config user.email "cloud-bot@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          git push -f "https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v6.git" HEAD:gh-pages
          echo "本地部署 HEAD: $(git rev-parse HEAD)"

      # ─── 部署后验证：真实比对 SHA，不一致即 fail（防静默黑 20 天）───
      - name: "✅ 部署验证 (ls-remote 比对 SHA)"
        if: ${{ env.SKIP_DEPLOY != 'true' }}
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 8
          REMOTE=$(git ls-remote "https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v6.git" gh-pages | cut -f1)
          LOCAL=$(cd dist && git rev-parse HEAD)
          echo "远程 gh-pages HEAD: $REMOTE"
          echo "本地 部署   HEAD: $LOCAL"
          if [ -z "$REMOTE" ] || [ "$REMOTE" != "$LOCAL" ]; then
            echo "::error::🚨 部署未生效！远程 gh-pages ($REMOTE) ≠ 本地 ($LOCAL)"
            exit 1
          fi
          echo "✅ gh-pages 已成功刷新，部署闸门通过"

      - name: "💓 写云端心跳"
        continue-on-error: true
        run: |
          echo "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') | cloud | cloud_data_fetch_17_31 | DONE" >> data/_heartbeat.log
          git config user.name "cloud-bot"
          git config user.email "cloud-bot@users.noreply.github.com"
          git add -f data/_heartbeat.log
          git diff --cached --quiet || (git commit -m "heartbeat: cloud_data_fetch done" && git push origin main)

      - name: "📝 写部署日志"
        run: |
          if [ "${SKIP_DEPLOY:-false}" = "true" ]; then
            echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_data_fetch_deploy\",\"host\":\"GitHubActions\",\"success\":true,\"skipped\":\"freshness_gate\"}" >> HANDOVER_LOG.jsonl
            echo "⏭️ 新鲜度闸门阻断：本地数据旧于 gh-pages，部署跳过"
          else
            echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_data_fetch_deploy\",\"host\":\"GitHubActions\",\"success\":true}" >> HANDOVER_LOG.jsonl
            echo "✅ 17:31 数据抓取+部署完成"
          fi

      # ─── 数据监控告警闸门：部署已完成，仅标红触发告警 ───
      - name: "🔎 数据监控告警闸门(正确性+新鲜度·仅告警)"
        if: always()
        run: |
          if [ "${MONITOR_FAIL:-0}" = "1" ]; then
            echo "::warning::数据监控命中问题(数据正确性或新鲜度一致性)，详情见 data/verify_report.json 与运维状态卡片；陈旧数据由本地 watchdog 自动修复"
          else
            echo "🟢 数据正确性 + 新鲜度一致性 监控通过"
          fi

      - name: "⛔ 失败通知"
        if: failure()
        run: echo "::error::☁️ cloud_data_fetch 构建/部署失败"

      - name: "⏭️ 跳过通知"
        if: ${{ env.SKIP_DEPLOY == 'true' }}
        run: echo "::warning::⏭️ 新鲜度闸门阻断：本地数据旧于 gh-pages，未部署。双机新数据保留完好。watchdog 稍后将尝试修复。"
