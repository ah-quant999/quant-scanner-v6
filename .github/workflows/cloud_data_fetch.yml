# 九宝量化 v6.0 — 云端收盘数据抓取 (17:31)
# 替换本地 close_p1，在 18:31 全量扫描前把数据准备好。

name: "☁️ 收盘数据抓取 (17:31)"

on:
  # ✅ 2026-07-16 闭环加固：云端恢复自主定时(cron)，发令枪降级为监控+幂等补触发。
  schedule:
    - cron: '31 9 * * 1-5'   # 17:31 CST 收盘数据抓取
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cloud-data-fetch
  cancel-in-progress: true

jobs:
  data-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt 2>/dev/null

      - name: 注入凭据
        env:
          TOKEN_JSON: ${{ secrets.ZSXQ_TOKEN }}
          NEODATA_TOKEN_JSON: ${{ secrets.NEODATA_TOKEN }}
        run: |
          mkdir -p data
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s\n' "$TOKEN_JSON" > data/zsxq_token.json
            echo "✅ zsxq_token 已注入"
          else
            echo "⚠️ 无 ZSXQ_TOKEN secret（知识星球数据跳过）"
          fi
          if [ -n "$NEODATA_TOKEN_JSON" ]; then
            printf '%s\n' "$NEODATA_TOKEN_JSON" > data/.neodata_token
            echo "✅ neodata_token 已注入"
          else
            echo "⚠️ 无 NEODATA_TOKEN secret（neodata 跳过）"
          fi

      - name: "📡 研报+投行信号"
        continue-on-error: true
        run: |
          python fetch_mahoro_signals.py --non-interactive 2>/dev/null || echo "[跳过] mahoro"
          python guanlan_extractor.py || echo "[跳过] guanlan"

      - name: "📡 全量数据抓取"
        continue-on-error: true
        run: |
          # 注：以下中国数据源已移至本机双机负责（美区 runner 无中国网络→60s 超时静默失败）：
          #   fetch_margin / fetch_etf_subscription / fetch_north_fund /
          #   fetch_sh_sz_history / fetch_up_down_stats / capital_flow_summary
          #   (etf_subscription.json 由 fetch_margin_etf.py 在云端覆盖)
          SCRIPTS="fetch_nt_data.py fetch_margin_etf.py fetch_suspension_alert.py fetch_stock_deviation.py fetch_sector_fund_flow.py fetch_sector_rs.py fetch_main_week.py fetch_market_alerts.py fetch_concept_ranking.py fetch_main_stock.py fetch_south_individual.py fetch_herding_data.py fetch_cffex_holdings.py fetch_inst_trade.py fetch_ipo_data.py fetch_macro_data.py fetch_fomc.py fetch_sh_index_fib.py fetch_sz_index_fib.py"
          # 并行执行：所有脚本同时启动，wait 等全部完成（wall-time 60s+10s SIGKILL max）
          PIDS=""
          for script in $SCRIPTS; do
            echo ">>> $script start $(date -Iseconds)"
            timeout --kill-after=10 60 python "$script" > /tmp/log_$script.log 2>&1 &
            PIDS="$PIDS $!"
          done
          # 等所有子进程
          for pid in $PIDS; do
            wait $pid
            rc=$?
            [ $rc -ne 0 ] && echo "  pid $pid exit $rc"
          done
          echo "=== 全量抓取完成 $(date -Iseconds) ==="
          # 简要汇总：每个脚本最后一行
          for script in $SCRIPTS; do
            tail -1 /tmp/log_$script.log 2>/dev/null | head -c 200 | sed "s/^/  $script: /"
            echo
          done

      - name: "📡 危机雷达"
        continue-on-error: true
        run: python fetch_crisis_data.py || echo "[跳过] crisis"

      # ─── 把 data/*.json 提交回 main（让 18:30 / 19:30 / 隔日 09:20 都能用到新鲜数据）───
      - name: "📤 提交 data 回 main"
        continue-on-error: true
        run: |
          git config user.name "cloud-bot"
          git config user.email "cloud-bot@users.noreply.github.com"
          git add -A data/ || true
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto: cloud data fetch $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ 已推 data 到 main"
          fi

      - name: "📝 写日志"
        run: |
          echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_data_fetch\",\"host\":\"GitHubActions\",\"success\":true}" >> HANDOVER_LOG.jsonl
          echo "✅ 17:31 数据抓取完成"

      # ─── 云端心跳上报（证明云端数据抓取活跃，即使不部署前端）───
      - name: "💓 上报云端心跳"
        continue-on-error: true
        run: python report_heartbeat.py --role cloud --mode cloud_data_fetch

      # ═══════════════════════════════════════════════
      # 🏗️ 构建+部署（将最新数据部署到 gh-pages，18:31 cloud_scanner 的最终版会覆盖本次）
      # ═══════════════════════════════════════════════

      - name: "🏗️ 构建前端"
        run: |
          python update_data_v2.py
          echo "✅ 构建完成"

      # ─── 生成独立页(standalone) 并校验与主站同源同戳 ───
      - name: "📱 生成独立页(standalone) + 同源同戳校验"
        run: |
          python ensure_standalone_sync.py --inject-buildstamp
          echo "✅ standalone 已与主站同步校验，可安全上线"

      # ─── 部署前诊断 ───
      - name: "🔍 部署前诊断 (确认 dist/index.html)"
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html 不存在，前端构建可能失败，终止部署"
            ls -la dist 2>/dev/null || echo "dist 目录不存在"
            exit 1
          fi
          echo "✅ dist/index.html 存在 ($(wc -c < dist/index.html) bytes)"

      # ─── 部署 ───
      - name: "🚀 部署到 GitHub Pages"
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          user_name: cloud-bot
          user_email: cloud-bot@users.noreply.github.com

      # ─── 部署后验证 ───
      - name: "✅ 部署验证 (ls-remote 确认 gh-pages)"
        run: |
          sleep 5
          git ls-remote origin gh-pages

      - name: "📝 写部署日志"
        run: |
          echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_data_fetch_deploy\",\"host\":\"GitHubActions\",\"success\":true}" >> HANDOVER_LOG.jsonl
          echo "✅ 17:31 数据抓取+部署完成"

      - name: "⛔ 失败通知"
        if: failure()
        run: echo "::error::☁️ cloud_data_fetch 构建/部署失败"
