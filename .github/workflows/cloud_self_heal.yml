# 九宝量化 v6.0 — 云端数据自愈器
# ==============================
# 取代本地阿狸咪的 t1_self_heal / industry_map_self_heal 自动化。
# 云端 cron 调度，不依赖本地机器开机，零 token 浪费。
#
# 需要仓库 Secret: GH_PAT ← 同本地 .gh_pat（触发 cloud_weekly.yml dispatch 用）
# 无 GH_PAT 时仍可检测+邮件告警，但无法自动补跑。
#
# 调度：
#   周六 09:30 CST — T+1 主检（cloud_weekly 07:30 跑完 2h 后）
#   周日 09:30 CST — industry_map 主检（cloud_weekly 06:30 跑完 3h 后）
#   周一 08:00 CST — T+1 兜底（用户 7:15 起床后）
#   周一 08:15 CST — industry_map 兜底

name: "☁️ 数据自愈器（云端）"

on:
  schedule:
    - cron: '30 1 * * 6'    # 周六 01:30 UTC = 09:30 CST — T+1 主检
    - cron: '30 1 * * 0'    # 周日 01:30 UTC = 09:30 CST — industry_map 主检
    - cron: '0 0 * * 1'     # 周一 00:00 UTC = 08:00 CST — T+1 兜底
    - cron: '15 0 * * 1'    # 周一 00:15 UTC = 08:15 CST — industry_map 兜底
  workflow_dispatch:
    inputs:
      task:
        description: 't1 / industry_map / both'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: cloud-self-heal
  cancel-in-progress: false

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: "📦 安装依赖"
        run: pip install -r requirements.txt 2>/dev/null

      - name: "🔑 注入凭据（zsxq_token + GH_PAT）"
        env:
          TOKEN_JSON: ${{ secrets.ZSXQ_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # zsxq_token（知识星球数据）
          mkdir -p data
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s\n' "$TOKEN_JSON" > data/zsxq_token.json
            echo "✅ zsxq_token 已注入"
          fi
          # GH_PAT（用于 dispatch cloud_weekly.yml）
          if [ -n "$GH_PAT" ]; then
            echo "✅ GH_PAT 已注入（ENV）"
          else
            echo "⚠️ GH_PAT secret 未设置——无法 dispatch cloud_weekly.yml 补跑，仅作检测+邮件告警"
            echo "⚠️ 请到仓库 Settings → Secrets and variables → Actions 添加 GH_PAT"
          fi

      # ─── T+1 自愈（周六主检 / 周一兜底） ───
      - name: "💰 T+1 自愈（周六主检 / 周一兜底）"
        if: github.event.schedule == '30 1 * * 6' || github.event.schedule == '0 0 * * 1' || github.event.inputs.task == 't1' || github.event.inputs.task == 'both'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python t1_self_heal.py --email

      # ─── industry_map 自愈（周日主检 / 周一兜底） ───
      - name: "🏭 industry_map 自愈（周日主检 / 周一兜底）"
        if: github.event.schedule == '30 1 * * 0' || github.event.schedule == '15 0 * * 1' || github.event.inputs.task == 'industry_map' || github.event.inputs.task == 'both'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python industry_map_self_heal.py --email
