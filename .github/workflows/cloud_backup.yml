# 九宝量化 v6.0 — 每日自动备份 (21:00)
# 关键数据文件自动备份，防止意外丢失

name: "☁️ 每日自动备份 (21:00)"

on:
  schedule:
    - cron: '0 13 * * *'    # 21:00 CST — 每天
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt 2>/dev/null

      - name: 运行 enhanced_backup.py
        continue-on-error: true
        run: |
          if [ -f enhanced_backup.py ]; then
            python enhanced_backup.py
          else
            # 备选方案：直接压缩 data/ 关键文件
            tar -czf "data/backup_$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M').tar.gz" \
              data/scan_result.json data/gold_pool.json data/candidate_pool.json \
              data/industry_map.json data/lhb_result.json data/north_fund.json \
              data/maharo_signals.json data/zsxq_token.json 2>/dev/null
            echo "✅ 关键数据已备份"
          fi

      - name: 提交备份到 main
        continue-on-error: true
        run: |
          git add data/backup_*.tar.gz 2>/dev/null || true
          git add backup_*/ 2>/dev/null || true
          git commit -m "backup: 每日自动备份 $(TZ=Asia/Shanghai date '+%Y-%m-%d')" 2>/dev/null || echo "无新备份"
          git push origin main 2>/dev/null || echo "推送跳过（无新内容）"

      - name: "📝 写日志"
        run: |
          echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"cloud_backup\",\"host\":\"GitHubActions\",\"success\":true}" >> HANDOVER_LOG.jsonl
          echo "✅ 备份完成"
