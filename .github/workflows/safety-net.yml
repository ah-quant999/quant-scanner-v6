name: "Safety Net - 定时任务兜底监控"

on:
  schedule:
    # ⚠️ 高频兜底轮询：每日(含周末) 09:00-19:00 北京时间每 15 分钟一次。
    # 工作日：本地双机(小九精准发令枪)均离线、云端数据过旧时补触发；
    # 周末：扫描数据冻结在周五属正常，本监控自动静默(见下方 weekend 保护)，不误报不空转。
    - cron: "*/15 1-11 * * *"   # 09:00-19:00 CST 每15分（每日）
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检查站点可访问性
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ah-quant999.github.io/quant-scanner-v6/ || echo "000")
          echo "::notice::站点状态码: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::站点不可访问！状态码: $STATUS"
          fi

      - name: 检测数据新鲜度
        id: fresh
        run: |
          HTML=$(curl -sL https://ah-quant999.github.io/quant-scanner-v6/ 2>/dev/null)
          
          # 提取 SCAN_DATA.scan_time
          SCAN_TIME=$(echo "$HTML" | grep -oP '"scan_time":\s*"\K[^"]+' | head -1)
          echo "SCAN_DATA时间: $SCAN_TIME"
          
          if [ -z "$SCAN_TIME" ]; then
            echo "::warning::无法提取 SCAN_DATA 时间，可能需要人工检查"
            exit 0
          fi

          # 🛌 周末休市保护
          DOW=$(TZ=Asia/Shanghai date +%u)
          if [ "$DOW" -ge 6 ]; then
            echo "::notice::🛌 周末休市，跳过新鲜度告警与兜底触发"
            echo "age_hours=0" >> $GITHUB_OUTPUT
            echo "scan_time=${SCAN_TIME:0:19}" >> $GITHUB_OUTPUT
            echo "phase=周末休市" >> $GITHUB_OUTPUT
            echo "threshold=999" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 计算时间差
          SCAN_TS=$(date -d "${SCAN_TIME:0:19}" +%s 2>/dev/null || date -d "${SCAN_TIME:0:10}" +%s 2>/dev/null || echo "0")
          NOW_TS=$(date +%s)
          DIFF_HOURS=$(( ($NOW_TS - $SCAN_TS) / 3600 ))
          
          # 盘中 09:00-15:00 阈值 2h；盘后 15:00-09:00 阈值 3h
          HOUR=$(TZ=Asia/Shanghai date +%H)
          if [ "$HOUR" -ge 9 ] && [ "$HOUR" -lt 15 ]; then
            THRESHOLD=2
            PHASE="盘中"
          else
            THRESHOLD=3
            PHASE="盘后"
          fi
          echo "::notice::当前阶段: ${PHASE} (阈值 ${THRESHOLD}h), 数据年龄: ${DIFF_HOURS}小时"
          
          if [ $DIFF_HOURS -gt $THRESHOLD ]; then
            echo "::warning::数据已超过${THRESHOLD}小时未更新（${DIFF_HOURS}h），${PHASE}定时任务可能中断！"
          elif [ $DIFF_HOURS -gt 12 ]; then
            echo "::error::数据已超过12小时未更新（${DIFF_HOURS}h），定时任务中断！请立即检查双机状态。"
          fi
          
          # 输出状态徽章用
          echo "age_hours=${DIFF_HOURS}" >> $GITHUB_OUTPUT
          echo "scan_time=${SCAN_TIME:0:19}" >> $GITHUB_OUTPUT
          echo "phase=${PHASE}" >> $GITHUB_OUTPUT
          echo "threshold=${THRESHOLD}" >> $GITHUB_OUTPUT

      # ─── 🔍 中国源新鲜度检查（2026-07-20 加：防 sector_fund_flow 等静默过期）───
      # 安全网现有检查只测 SCAN_DATA.scan_time（云端扫描时间），
      # 不检查 sector_fund_flow / concept_ranking 等中国数据源。
      # 这些数据由小九(@09:20/10:30/11:45)刷新并推 main。
      # 若小九离线/中断，中国源过期但 scan_time 新鲜 → 安全网看不见。
      - name: 检测中国数据新鲜度
        id: cn_fresh
        run: |
          DOW=$(TZ=Asia/Shanghai date +%u)
          if [ "$DOW" -ge 6 ]; then
            echo "🛌 周末休市，跳过中国源检查"
            echo "cn_expired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="https://ah-quant999.github.io/quant-scanner-v6/data"
          CN_EXPIRED=""
          for f in sector_fund_flow.json concept_ranking.json market_alerts.json; do
            RAW=$(curl -sL "$BASE/$f" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('update_time',''))" 2>/dev/null || echo "")
            if [ -n "$RAW" ]; then
              TS=$(TZ=Asia/Shanghai date -d "${RAW:0:19}" +%s 2>/dev/null || echo 0)
              NOW=$(TZ=Asia/Shanghai date +%s)
              AGE=$(( (NOW - TS) / 3600 ))
              echo "  $f: $RAW → ${AGE}h ago"
              if [ $AGE -gt 2 ]; then
                echo "::warning::$f 已 ${AGE}h 未更新（update_time=${RAW:0:19}）"
                CN_EXPIRED="true"
              fi
            else
              echo "  $f: 无法读取"
            fi
          done
          echo "cn_expired=${CN_EXPIRED:-false}" >> "$GITHUB_OUTPUT"

      - name: 汇总报告
        run: |
          echo "═══════════════════════════════════════"
          echo "  🛡️ 九宝量化兜底监控"
          echo "  检查时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          echo "  阶段: ${{ steps.fresh.outputs.phase }} (阈值 ${{ steps.fresh.outputs.threshold }}h)"
          echo "  数据年龄: ${{ steps.fresh.outputs.age_hours }}小时"
          echo "  最新扫描: ${{ steps.fresh.outputs.scan_time }}"
          echo "═══════════════════════════════════════"

      - name: 自动兜底（本地双机均离线时补触发云端）
        if: ${{ steps.fresh.outputs.age_hours != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGE: ${{ steps.fresh.outputs.age_hours }}
          THRESHOLD: ${{ steps.fresh.outputs.threshold }}
          PHASE: ${{ steps.fresh.outputs.phase }}
        run: |
          if [ "${AGE:-0}" -gt "${THRESHOLD:-2}" ]; then
            echo "::error::数据已 ${AGE} 小时未更新（${PHASE}阈值 ${THRESHOLD}h），本地双机疑似均离线，自动补触发云端"
            echo ">>> 触发 cloud_intraday.yml（盘中/总览刷新+部署）"
            gh workflow run cloud_intraday.yml
            echo ">>> 触发 cloud_data_fetch.yml（17:31 收盘数据抓取）"
            gh workflow run cloud_data_fetch.yml
            echo ">>> 触发 cloud_scanner.yml（18:31 收盘扫描+部署）"
            gh workflow run cloud_scanner.yml
            HOUR=$(TZ=Asia/Shanghai date +%H)
            if [ "$HOUR" -ge 16 ] && [ "$HOUR" -lt 19 ]; then
              echo ">>> 盘后时段，额外触发 cloud_post_close.yml slot=30 8（全模块三卡片+部署）"
              gh workflow run cloud_post_close.yml --field slot='30 8 * * *'
            fi
          else
            echo "✅ 数据新鲜（${AGE}h ≤ ${PHASE}阈值 ${THRESHOLD}h），无需兜底"
          fi
