function renderCapitalFlowCard() {
  var d = window.CAPITAL_FLOW_DATA || {};
  var card = document.getElementById('capitalFlowCard');
  if (!card) return;
  if (!d.north_south && !d.inst && !d.hot_money) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  var tEl = document.getElementById('capFlowTime');
  if (tEl) tEl.textContent = '更新 ' + (d.update_time || '') + ' | 南向为全市场口径；北向/机构/游资为龙虎榜席位口径';

  var body = document.getElementById('capFlowBody');
  if (!body) return;

  function dirClass(dirStr) {
    if (!dirStr) return '';
    if (dirStr.indexOf('流入') !== -1 || dirStr.indexOf('买入') !== -1 || dirStr.indexOf('净流入') !== -1) return 'up';
    if (dirStr.indexOf('流出') !== -1 || dirStr.indexOf('卖出') !== -1 || dirStr.indexOf('净流出') !== -1) return 'down';
    return '';
  }

  function row(label, data, color) {
    if (!data) return '';
    var direction = data.direction || '-';
    var style = data.style || '-';
    var cb = data.common_buy && data.common_buy.length ? data.common_buy.slice(0,3).join('、') : '-';
    var cs = data.common_sell && data.common_sell.length ? data.common_sell.slice(0,3).join('、') : '-';
    var signal = data.signal || '-';
    var dc = dirClass(direction);
    return '<tr style="background:' + color + ';">'
      + '<td style="padding:6px 8px;border:1px solid #ddd;font-weight:600;white-space:nowrap;">' + label + '</td>'
      + '<td style="padding:6px 8px;border:1px solid #ddd;text-align:center;' + (dc ? 'color:' + (dc === 'up' ? '#e94560' : '#27ae60') + ';font-weight:600;' : '') + '">' + direction + '</td>'
      + '<td style="padding:6px 8px;border:1px solid #ddd;">' + style + '</td>'
      + '<td style="padding:6px 8px;border:1px solid #ddd;color:#e94560;">' + cb + '</td>'
      + '<td style="padding:6px 8px;border:1px solid #ddd;color:#27ae60;">' + cs + '</td>'
      + '<td style="padding:6px 8px;border:1px solid #ddd;font-size:10.5px;max-width:180px;">' + signal + '</td>'
      + '</tr>';
  }
  body.innerHTML = ''
    + row('🌏 南向资金', d.north_south, '#f5fff5')
    + row('🌎 龙虎榜北向席位', d.bx, '#f0f8ff')
    + row('🏦 机构席位', d.inst, '#fff5f5')
    + row('🚀 游资席位', d.hot_money, '#f5f5ff');

  if (d.signals && d.signals.length) {
    body.innerHTML += '<tr><td colspan="6" style="padding:6px 8px;border:1px solid #ddd;background:#fafafa;font-size:10.5px;color:#444;">📌 ' + d.signals.join(' ｜ ') + '</td></tr>';
  }

  // 研判文字（仿左图：自然语言解读）
  var analysisEl = document.getElementById('capFlowAnalysis');
  if (analysisEl) {
    if (d.analysis && d.analysis.length) {
      var html = '<div style="margin-bottom:4px;font-weight:700;color:#4527a0;font-size:11.5px;">📊 资金研判</div>';
      html += d.analysis.map(function(p){
        return '<div style="margin:3px 0;line-height:1.65;">' + p + '</div>';
      }).join('');
      analysisEl.innerHTML = html;
      analysisEl.style.display = 'block';
    } else {
      analysisEl.style.display = 'none';
    }
  }

  // 三方共振单独展示
  var resEl = document.getElementById('capFlowResonance');
  if (resEl) {
    var parts = [];
    if (d.common_buy_stocks && d.common_buy_stocks.length) {
      parts.push('<span style="color:#e94560;">🔴 三方共振净买入：' + d.common_buy_stocks.slice(0,5).join('、') + '</span>');
    }
    if (d.common_sell_stocks && d.common_sell_stocks.length) {
      parts.push('<span style="color:#27ae60;">🟢 三方共振净卖出：' + d.common_sell_stocks.slice(0,5).join('、') + '</span>');
    }
    if (parts.length) {
      resEl.innerHTML = parts.join(' ｜ ');
      resEl.style.display = 'block';
    } else {
      resEl.style.display = 'none';
    }
  }
}

</script>
